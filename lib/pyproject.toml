[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homebase"
version = "0.1.0"
description = "LINZ NETZ smart meter readings: portal client, readings archive, fusion, costs, Home Assistant client"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "websocket-client>=1.7,<2",
    "tzdata",
    "openpyxl>=3.1,<4",
]

[tool.setuptools]
packages = ["homebase"]
