services:
  databot:
    # `./homebase` builds this image locally when the sources change; on a machine
    # without the sources `docker compose pull` fetches the published multi-arch image
    image: ghcr.io/ulrichlehner/homebase-databot:main
    build: ./databot
    pull_policy: missing
    container_name: databot
    environment:
      - EXPORT_DIR=/app/export
    env_file:
      - ./.env
    restart: always
    volumes:
      # DATA_DIR from the environment (set by ./homebase), default ./data/databot
      - ${DATA_DIR:-./data/databot}:/app/export
