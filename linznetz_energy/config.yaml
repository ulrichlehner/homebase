name: LINZ NETZ energy
version: "0.1.0"
slug: linznetz_energy
description: LINZ NETZ portal readings as long-term statistics for the Energy dashboard
url: https://github.com/ulrichlehner/homebase/tree/main/linznetz_energy
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# prebuilt by .github/workflows/addon-image.yml
image: ghcr.io/ulrichlehner/homebase-linznetz-energy-{arch}
# websocket access to the HA core through the Supervisor (statistics, notifications)
homeassistant_api: true
map:
  # the add-on's own config folder (/addon_configs/<slug>): CSV files, part of backups
  - addon_config:rw
  # one-time import of an existing CSV archive (step 5)
  - share:ro
options:
  username: ""
  password: ""
  meter_id: ""
  site: ""
  portal_hours: 12
schema:
  username: str
  password: password
  meter_id: match(^AT[0-9A-Z]{31}$)
  site: match(^[a-z0-9_]+$)
  portal_hours: int(6,48)
