<?xml version="1.0" encoding="UTF-8"?>
<!-- Add-on logo: the icon (embedded from icon.svg) and the name. The text colours read on light
     and dark backgrounds. Source of logo.png, rendered by `./homebase assets`. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="250" height="100" viewBox="0 0 250 100">
  <image x="0" y="4" width="92" height="92" xlink:href="icon.svg"/>
  <g font-family="DejaVu Sans" font-weight="bold">
    <text x="100" y="45" font-size="25" textLength="148" lengthAdjust="spacingAndGlyphs" fill="#607D8B">LINZ NETZ</text>
    <text x="100" y="82" font-size="32" fill="#03A9F4">Energy</text>
  </g>
</svg>
