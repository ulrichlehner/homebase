configuration:
  portal_username:
    name: Portal-Benutzername
    description: Login für das LINZ NETZ Serviceportal.
  portal_password:
    name: Portal-Passwort
  metering_point:
    name: Zählpunkt
    description: Die 33-stellige Zählpunktnummer (nicht die Zählernummer), beginnt mit AT.
  site:
    name: Standort
    description: Kurzer Name des Orts in Kleinbuchstaben, Teil der Statistik-IDs (linznetz_energy:<standort>_grid_consumption).
  fetch_interval_hours:
    name: Abrufintervall Portal (Stunden)
    description: Wie oft neue Werte vom Portal geholt werden. Das Portal zeigt einen Tag erst ein bis zwei Tage später, 12 Stunden reichen.
