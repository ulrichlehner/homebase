configuration:
  portal_username:
    name: Portal-Benutzername
    description: Login für das LINZ NETZ Serviceportal.
  portal_password:
    name: Portal-Passwort
  metering_point:
    name: Zählpunkt
    description: Die Zählpunktnummer (nicht die Zählernummer) wie auf der Rechnung oder im Portal, 33 Zeichen, beginnt mit AT. Leerzeichen sind erlaubt.
  site:
    name: Standort
    description: Name des Orts, wird so angezeigt wie eingegeben (z. B. „Home“ oder „Zweitwohnsitz Linz“). Die Statistik-IDs verwenden eine vereinfachte Form (linznetz_energy:zweitwohnsitz_linz_grid_consumption).
  fetch_interval_hours:
    name: Abrufintervall Portal (Stunden)
    description: Wie oft neue Werte vom Portal geholt werden. Das Portal zeigt einen Tag erst ein bis zwei Tage später, 12 Stunden reichen.
