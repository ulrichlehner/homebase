configuration:
  portal_username:
    name: Portal username
    description: Login of the LINZ NETZ service portal.
  portal_password:
    name: Portal password
  metering_point:
    name: Metering point
    description: The metering point number (Zählpunktnummer, not the meter number) as on your bill or in the portal, 33 characters starting with AT. Spaces are fine.
  site:
    name: Site
    description: Name of the place, shown as you write it (e.g. "Home" or "Second home Linz"). The statistic IDs use a simplified form (linznetz_energy:second_home_linz_grid_consumption).
  live_meter_entity:
    name: Live meter reading (optional)
    description: A live energy counter of the meter in Home Assistant (total in kWh), for example from the wM-Bus radio of the meter, e.g. sensor.home_grid_total_energy_consumption. Its readings become the primary source of the consumption statistic; the portal checks them and fills gaps. Empty means portal only. Easier to pick from a list on the add-on page (Open Web UI).
  fetch_interval_hours:
    name: Portal fetch interval (hours)
    description: How often new readings are fetched from the portal. It shows a day only one to two days later, so 12 hours is enough.
