configuration:
  portal_username:
    name: Portal username
    description: Login of the LINZ NETZ service portal.
  portal_password:
    name: Portal password
  metering_point:
    name: Metering point
    description: The 33-character metering point number (Zählpunktnummer, not the meter number), starts with AT.
  site:
    name: Site
    description: Short lowercase name of the place, used in the statistic IDs (linznetz_energy:<site>_grid_consumption).
  fetch_interval_hours:
    name: Portal fetch interval (hours)
    description: How often new readings are fetched from the portal. It shows a day only one to two days later, so 12 hours is enough.
