configuration:
  portal_username:
    name: Portal username
    description: Login of the LINZ NETZ service portal.
  portal_password:
    name: Portal password
  metering_point:
    name: Metering point
    description: The metering point number (Zählpunktnummer, not the meter number) as on your bill or in the portal, 33 characters starting with AT. Spaces are fine.
  site:
    name: Site
    description: Short name of the place, part of the statistic IDs (linznetz_energy:<site>_grid_consumption). Keep "home" unless you have several sites.
  fetch_interval_hours:
    name: Portal fetch interval (hours)
    description: How often new readings are fetched from the portal. It shows a day only one to two days later, so 12 hours is enough.
