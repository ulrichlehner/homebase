# Builds the image of the Home Assistant add-on (linznetz_energy/) per architecture.
# HA pulls ghcr.io/ulrichlehner/homebase-linznetz-energy-<arch>:<version from config.yaml>,
# so bump the version in linznetz_energy/config.yaml to roll out a change.

name: Build the add-on image

on:
  push:
    paths:
      - 'databot/**'
      - 'linznetz_energy/**'
      - '.github/workflows/addon-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read the add-on version
        id: version
        run: echo "version=$(sed -nE 's/^version: *"?([^"]+)"?/\1/p' linznetz_energy/config.yaml)" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: linznetz_energy/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}-linznetz-energy-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}-linznetz-energy-${{ matrix.arch }}:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
