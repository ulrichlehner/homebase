# Builds the image of the Home Assistant add-on (linznetz_energy/) per architecture.
# HA pulls ghcr.io/ulrichlehner/homebase-linznetz-energy-<arch>:<version from config.yaml>.
#
# Version tags are immutable: on main an image is only built when the version in
# config.yaml has no image yet, i.e. after a release PR of release-please was merged.
# Other branches only push the tag `dev` (a build check, HA never installs it).

name: Build the add-on image

on:
  push:
    paths:
      - 'lib/**'
      - 'linznetz_energy/**'
      - '.github/workflows/addon-image.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild the version in config.yaml even if its image exists (deliberate exception)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    env:
      IMAGE: ghcr.io/${{ github.repository }}-linznetz-energy-${{ matrix.arch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide the tags
        id: tags
        run: |
          version="$(sed -nE 's/^version: *"?([^" #]+)"?.*/\1/p' linznetz_energy/config.yaml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "tags=$IMAGE:dev" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.force }}" != "true" ] && docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "Image $IMAGE:$version exists already, nothing to build"
            echo "tags=" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:$version,$IMAGE:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.tags.outputs.tags != ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.tags.outputs.tags != ''
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.tags.outputs.tags != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: linznetz_energy/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
