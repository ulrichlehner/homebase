# Runs the tests (pytest.ini: lib/tests, databot/tests, linznetz_energy/tests) on every pull
# request and on main, on the Python of the images (python:3.12-slim in the Dockerfiles).

name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            lib/pyproject.toml
            databot/requirements*.txt

      - name: Install the library and the test requirements
        run: pip install -e lib -r databot/requirements-dev.txt

      - name: Run the tests
        run: python -m pytest -q
